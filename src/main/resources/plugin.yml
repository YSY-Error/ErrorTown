name: ErrorTown
main: com.ErrorTown.Main
# 1.13 is the *minimum* API level, not the target: a higher api-version makes older servers
# refuse the plugin outright. ErrorTown is compiled against the Spigot 1.21 API and verified
# against Spigot 26.2 and Paper 26.2, so one jar covers Spigot / Paper / Purpur / Leaves on
# Minecraft 1.21 through 26.2. Folia is NOT supported - see README.
api-version: '1.13'
author: YSYError
version: '${version}'
description: 错误小镇(YSYError) - 错误庄园系统
depend: [Vault, NBTAPI]
softdepend: [PlaceholderAPI,Multiverse-Core,FastAsyncWorldEdit,WorldEdit,PlayerPoints,HolographicDisplays,ProtocolLib,RealisticSeasons]
commands:
  st:
    description: 错误庄园系统主命令
    aliases: [sh]
    permission-message: 你没有权限使用该命令

permissions:
  ErrorTown.command.user:
    description: 基础用户权限(创建/管理/访问家园)
    default: true
    children:
      ErrorTown.Create.1: true
      ErrorTown.Create.2: true
      ErrorTown.Create.airland: true
      ErrorTown.Visit: true
      ErrorTown.Update: true
      ErrorTown.Look: true
      ErrorTown.Public: true
      ErrorTown.PVP: true
      ErrorTown.PickUp: true
      ErrorTown.Drop: true
      ErrorTown.Rank: true
      ErrorTown.Flowers: true
      ErrorTown.Trust: true
      ErrorTown.Deny: true
      ErrorTown.Invite: true
      ErrorTown.Quit: true
      ErrorTown.check: true
      ErrorTown.tpset: true
      ErrorTown.WholeDelete: true
  ErrorTown.Create.1:
    description: 创建普通世界家园
    default: true
  ErrorTown.Create.2:
    description: 创建超平坦家园
    default: true
  ErrorTown.Create.airland:
    description: 创建空岛家园
    default: true
  ErrorTown.Create.*:
    description: 所有类型家园创建权限
    default: false
  ErrorTown.Visit:
    description: 访问他人家园
    default: true
  ErrorTown.SetSpawn:
    description: 设置家园中心点/传送点
    default: false
  ErrorTown.Public:
    description: 切换家园公开状态
    default: true
  ErrorTown.PVP:
    description: 切换PVP状态
    default: true
  ErrorTown.PickUp:
    description: 切换拾取权限
    default: true
  ErrorTown.Drop:
    description: 切换丢弃权限
    default: true
  ErrorTown.Update:
    description: 升级家园
    default: true
  ErrorTown.Look:
    description: 查看家园信息
    default: true
  ErrorTown.locktime:
    description: 锁定家园时间
    default: false
  ErrorTown.lockweather:
    description: 锁定家园天气
    default: false
  ErrorTown.Day:
    description: 设置白天
    default: false
  ErrorTown.Night:
    description: 设置黑夜
    default: false
  ErrorTown.Rain:
    description: 设置雨天
    default: false
  ErrorTown.Sun:
    description: 设置晴天
    default: false
  ErrorTown.Nether:
    description: 传送至公共地狱
    default: false
  ErrorTown.End:
    description: 传送至公共末地
    default: false
  ErrorTown.Biome:
    description: 修改家园群系
    default: false
  ErrorTown.Admin:
    description: 错误庄园管理员权限
    default: op
    children:
      ErrorTown.Admin.SetLevel: true
      ErrorTown.Admin.AddLevel: true
      ErrorTown.Admin.Create: true
      ErrorTown.Admin.Delete: true
      ErrorTown.Admin.TP: true
      ErrorTown.Admin.Reload: true
      ErrorTown.Admin.TP.*: true
  ErrorTown.Admin.SetLevel:
    description: 管理员设置家园等级
    default: op
  ErrorTown.Admin.AddLevel:
    description: 管理员增加家园等级
    default: op
  ErrorTown.Admin.Create:
    description: 管理员为玩家创建家园
    default: op
  ErrorTown.Admin.Delete:
    description: 管理员删除家园
    default: op
  ErrorTown.Admin.TP:
    description: 管理员传送到玩家家园
    default: op
  ErrorTown.Admin.TP.*:
    description: 管理员传送至所有家园
    default: op
  ErrorTown.Admin.Reload:
    description: 管理员重载插件
    default: op
  ErrorTown.forcetp:
    description: 强制传送至家园(无视权限)
    default: false
  ErrorTown.Rank:
    description: 查看排行榜
    default: true
  ErrorTown.Flowers:
