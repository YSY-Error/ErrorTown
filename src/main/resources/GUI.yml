ServiceCostSetSpawnCoordsTitle: '§8>>> §6设置中心(坐标) - 费用确认'
# 菜单行数。过去 27/45/54 写死在代码里,现在可改。填 1-6(行),或直接填 9 的倍数(最大 54)。
# 删掉某一项 = 用内置默认值。注意:改小之后超出范围的按钮 Index 会被跳过。
MainSize: 5
CheckSize: 5
CreateSize: 5
ManageSize: 5
Manage2Size: 5
Manage3Size: 5
VisitSize: 6
InviteSize: 6
TrustSize: 6
DenySize: 6
BiomeSize: 6
RulesSize: 5
UpgradeSize: 3
SetSpawnSize: 3
OwnedHomesSize: 3
CreateCostSize: 3
ServiceCostSize: 3
GiftSize: 5
# 所有标题、按钮名称与 Lore 都支持 MiniMessage / & 颜色码 / § 颜色码,可混用。
# 例:  MainTitle: '<gradient:#ff5f6d:#ffc371>错误庄园</gradient>'
#
# 每个按钮除了原有的 Material / CustomName / Lores / Enchants / Index / SubID /
# LeftInTo / RightInTo / KeepOpen 之外,还支持下面这些可选键(不写就不生效):
#   Material: 'myfurniture:oak_chair'   # 装了 CraftEngine 时可直接填自定义物品 ID
#   Permission: 'ErrorTown.Nether'      # 没有该权限的玩家看不到这个按钮(纯显示控制,
#                                       # 按钮执行的指令本身仍会各自校验权限)
#   Amount: 1                           # 显示的堆叠数量
#   CustomModelData: 10001              # 资源包 CustomModelData
#   ItemModel: 'mypack:home_icon'       # 1.21.4+ 的 item_model 组件(旧版本自动忽略)
#   Glow: true                          # 附魔光效,且不显示附魔文字
#   Unbreakable: true
#   HideAll: true                       # 隐藏全部物品信息(属性/附魔/染色等)
#   ItemFlags: ['HIDE_ATTRIBUTES', 'HIDE_DYE']
#   SkullOwner: '<viewer>'              # 渲染成玩家头颅,<viewer> = 打开菜单的玩家
Next: '§a>>> 下一页'
NextMaterial: 'FEATHER'
Prev: '§a<<< 上一页'
PrevMaterial: 'FEATHER'
#是否启用默认玻璃板的模板
EnableCheckGuiNormalPane: true
EnableCreateGuiNormalPane: true
EnableDenyGuiNormalPane: true
EnableInviteGuiNormalPane: true
EnableMainGuiNormalPane: true
EnableManageGuiNormalPane: true
EnableManageGui2NormalPane: true
EnableManageGui3NormalPane: true
EnableTrustGuiNormalPane: true
EnableInviteGuiNormalPane: true
EnableVisitGuiNormalPane: true
#玻璃板的材质,不同版本的材质名不同.(1.21 使用带颜色的具体材质名)
PaneMaterial: 'BLACK_STAINED_GLASS_PANE'
#头颅是否显示皮肤:
EnableSkullSkin: true
#头颅的材质名,不同版本的材质名不同.(1.13+ 为 PLAYER_HEAD)
HeadMaterial: 'PLAYER_HEAD'
#玻璃板的颜色ID
GlassSubID: 15

