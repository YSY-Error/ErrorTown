BiomeTitle: '§b>>> §dChange Biome'
RulesTitle: '§8>>> §6Home Rules'
UpgradeTitle: '§8>>> §6Choose How To Upgrade'
SetSpawnTitle: '§8>>> §6Move Home Centre'
OwnedHomesTitle: '§8>>> §6Select A Home To Visit'
CreateCostTitle: '§8>>> §6Create A Home - Choose Payment'
ServiceCostTitle: '§8>>> §6Confirm Service Cost'
ServiceCostDifficultyTitle: '§8>>> §6Change Difficulty - Confirm Cost'
ServiceCostSetSpawnHereTitle: '§8>>> §6Set Centre (Here) - Confirm Cost'
ServiceCostSetSpawnCoordsTitle: '§8>>> §6Set Centre (Coords) - Confirm Cost'
# Menu row counts. These were hard-coded at 27/45/54 slots. Use 1-6 (rows), or a multiple of 9
# up to 54. Remove a key to fall back to the built-in size. Buttons whose Index falls outside a
# shrunken menu are skipped.
MainSize: 5
CheckSize: 5
CreateSize: 5
ManageSize: 5
Manage2Size: 5
Manage3Size: 5
VisitSize: 6
InviteSize: 6
TrustSize: 6
DenySize: 6
BiomeSize: 6
RulesSize: 5
UpgradeSize: 3
SetSpawnSize: 3
OwnedHomesSize: 3
CreateCostSize: 3
ServiceCostSize: 3
GiftSize: 5
# Titles, button names and lore all accept MiniMessage, & codes and § codes, mixed freely.
# e.g.  MainTitle: '<gradient:#ff5f6d:#ffc371>ErrorTown</gradient>'
#
# Besides the original Material / CustomName / Lores / Enchants / Index / SubID /
# LeftInTo / RightInTo / KeepOpen, every button also accepts these optional keys:
#   Material: 'myfurniture:oak_chair'   # a CraftEngine item id, when CraftEngine is installed
#   Permission: 'ErrorTown.Nether'      # hide the button from players without this node. Display
#                                       # only - the command it runs still checks permissions.
#   Amount: 1
#   CustomModelData: 10001
#   ItemModel: 'mypack:home_icon'       # 1.21.4+ item_model component; ignored on older servers
#   Glow: true                          # enchantment shimmer with no enchantment text
#   Unbreakable: true
#   HideAll: true
#   ItemFlags: ['HIDE_ATTRIBUTES', 'HIDE_DYE']
#   SkullOwner: '<viewer>'              # render as a player head; <viewer> = the menu's viewer
Next: '§a>>> Next'
NextMaterial: 'FEATHER'
Prev: '§a<<< Prev'
PrevMaterial: 'FEATHER'
#是否启用默认玻璃板的模板
EnableCheckGuiNormalPane: true
EnableCreateGuiNormalPane: true
EnableDenyGuiNormalPane: true
EnableInviteGuiNormalPane: true
EnableMainGuiNormalPane: true
EnableManageGuiNormalPane: true
EnableManageGui2NormalPane: true
EnableTrustGuiNormalPane: true
EnableInviteGuiNormalPane: true
EnableVisitGuiNormalPane: true
#玻璃板的材质, different versions of the material name are different.
PaneMaterial: 'BLACK_STAINED_GLASS_PANE'
#头颅是否显示皮肤:
EnableSkullSkin: true
#头颅的材质名, different versions of the material name are different.
HeadMaterial: 'PLAYER_HEAD'
