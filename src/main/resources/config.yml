# 配置文件版本:
Version: 2.1

# 汉化语言文本:
# Chinese、Chinese_TW、English
Language: Chinese


# 是否开启BungeeCord数据库同步模式:
BungeeCord: false
# Database setting.
Type: MySQL
Host: localhost
Port: 3306
Database: root
Username: root
Password: root

HikariCP:
  connectionTimeout: 30000
  # 连接超时时间 默认值：30000（30秒）
  minimumIdle: 50
  # 最小空闲连接数
  maximumPoolSize: 30
# 池允许达到的最大大小，包括空闲和正在使用的连接


# 随机地图模板列表配置,对应指令/sh create random:
Random:
- '1'
- '2'


# 在不需要该家园功能的子服,但是需要快捷传送的子服内将其改为true
DisableFunctionButTeleport: false

# 是否开启均衡负载,在人数少的服务器创建家园?
AutoReCreateInLowerLagHome: true
# 均衡负载根据什么？Player还是TPS,Player即指玩家少的服务器,TPS则指三次tps均值最高的那个服务器，如果是TPS需要提前安装Server的papi拓展,/papi ecloud download Server.
DecideBy: Player
# 是否开启加载家园存档根据DecideBy进行转移加载?.
AutoMoveWorldFilesToOther: false
# 是否只有地图被卸载关闭了才能进行存档转移操作?(此功能看需特殊开启,大部分人不需要用到,改为false即可)
MoveWorldAfterUnLoad: false

# 是否启用异步家园形状创建?:
FaweSwitch: false
# 边界形状材质,默认基岩.
BorderMaterial: BEDROCK
# 边界形状,Square代表矩形,Circle代表球体.
BorderShape: Square
# 升级边界的时候是否清空老的边界.
UpdateClearOld: false

# 耕地材质选择,1.13+ (含1.21) 填写 FARMLAND, 1.12.2及以下填写 SOIL
SoilType: FARMLAND

# 是否开启高度限制
EnableHeightLimit: true
# 最高
MaxHeight: 255

# 服务器名字,不同子服要求设置的不一样才可以.
Server: 家园一区
# 插件前缀:
Prefix: §b[§d错误庄园§b]
# 右键打开菜单的物品材质:
Material: COMPASS

# 是否开启家园聊天前缀自动在玩家聊天时显示（聊天不支持papi时开启本功能,如ESS)(若您有MiaoChat等聊天插件,可以用Papi变量)(兼容多世界变量)
EnableChatPrefix: true

# 违法名字禁止使用本插件,如多世界的名字.
IlleagalName:
- zc
- world

# 创建家园前是否清空背包.
ClearInventoryBeforeCreate: false

# 创建家园后执行的指令[后台执行]:
# DispathCommand:
#  - '[console]kit xinshou give <Name>'
#  - '[player]kit xinshou'
DispathCommand: []
# 删除家园后执行
AfterDeleteDispathCommand: []
# 升级后执行
AfterUpdateDispathCommand: []
# 是否开启删除的二次确认
EnableConfirmDelete: true

InviteAccess:
  MaxTotalHomes: 3


# 默认创建的家园世界/SH create 2 [设置为0则禁用]
NormalType: 1

HomeTerrain:
  Enabled: true
  GenerateStructures: false
  PermanentDay: true
  DayTime: 6000

HomeCreationQueue:
  MaxConcurrent: 2

HomeTravel:
  AllowNetherEnd: false

HomeUpgrade:
  LevelSizes: [8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96]
# 是否自定义种子,为0则不启用自定义种子.
Seed: 0

# ========== 创建家园收费 ==========
# 开启后玩家创建家园需要付费 (左键=随机种子, 右键=指定种子)
CreateCost:
  Enable: true
  # 随机种子 (左键创建)
  RandomSeed:
    Money: 59999
    Points: 520
  # 指定种子 (右键创建)
  CustomSeed:
    Money: 99999
    Points: 999

# ========== 创建世界模板加速 ==========
# 为普通地形/超平坦指定一个已预生成好的模板世界目录名或绝对路径。
# 开启后 /sh create 1/2 会优先复制模板，再加载世界，通常比实时自然生成更稳。
CreateTemplate:
  EnableNormal: false
  NormalWorld: ''
  EnableFlat: false
  FlatWorld: ''

# 是否开启家园出生点检测,如果为虚空则为玩家搭一个草方块防止掉进虚空[可选开启,空岛推荐]
