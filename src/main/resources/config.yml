- BOTANIA_STARFIELD|3|18
- BOTANIA_STARFIELD|2|9
- BOTANIA_STARFIELD|1|4
# 是否在检测到放置上限后清空掉已放置的多余的方块?
EnableClearExtraBlocks: false


# 是否开启CustomEntityMax,动物统一为Animals
