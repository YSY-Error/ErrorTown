# 是否开启不刷怪,false不刷怪,true刷怪
doMobSpawning: true
# 是否开启防爆功能,false为开启,true为关闭.
mobGriefing: true
# 是否关闭火势蔓延功能,false为开启,true为关闭
doFireTick: false
# 创建家园时的默认设置
NormalPublic: false
NormalPVP: false
NormalPickup: true
NormalDrop: true
# 被踢出时后台执行的指令:
BeKickedCommand: spawn <Name>

# 是否开启CustomTileMax
