# 是否开启生物黑名单功能
EnableBlackEntities: false
# 防止村民养殖和出现逆天村民,列入黑名单.
BlackEntitiesList:
- VILLAGER

# 是否禁止指定物品在无权限的家园中使用:
EnableBlackItemsUseInNoPermission: false
# 黑名单物品列表
BlackItems:
- DIAMOND_SWORD



# 默认的世界模式选择,(设置为''则禁用)
Difficulty: Easy
# 文本格式化。作用于全部提示消息、GUI 按钮名称与 Lore。
# Mode:
#   auto        - 默认。只有含 <标签> 的文本才走 MiniMessage,其余保持原样,零开销、零风险。
#   minimessage - 所有文本都按 MiniMessage 解析。转义规则更严格,改前请通读 MiniMessage 文档。
#   legacy      - 完全关闭 MiniMessage,只认颜色码。
# MiniMessage 示例:
#   "<gradient:#ff5f6d:#ffc371>错误庄园</gradient>"
#   "<bold><#55FF55>家园创建成功"
#   "<rainbow>欢迎回家"
# TranslateAmpersand: 是否把 &a / &l / &#RRGGBB 也当作颜色码(§ 码始终有效)。
# 若你的消息里需要出现字面量 & 后跟字母,把它关掉。
Formatting:
  Mode: auto
  TranslateAmpersand: true

# CraftEngine 自定义方块的限额。默认关闭。
# 为什么要单独一项:原有的 TileList 限额是数 Chunk.getTileEntities(),而 CraftEngine 的自定义
# 方块大多不是 block entity,根本不会出现在那个列表里,所以过去完全不受 TileList 约束。
# 为什么默认关闭:正因为不是 block entity,没有现成的列表可数,只能实际去看方块。整块区块约
# 9.8 万个方块,每次放置都扫一遍不可接受,所以这里只扫放置点周围一个立方体 —— 也就是说限额是
# "局部的"而不是"整块区块的"。这是刻意的取舍,请自行决定是否接受。
# 规则写在 TileList 里,匹配串加 ce: 前缀,例如:
#   TileList:
#   - 'chunk|ce:myfurniture:oak_chair|4'
# 不带 ce: 前缀的条目仍然走原来的 NBT 匹配,行为不变。
CraftEngineBlockLimit:
  Enabled: false
  # 扫描半径(方块)。1-17,默认 6(即 13x13x13)。调大会显著增加每次放置的开销。
  ScanRadius: 6

# 是否生成家园里的自然建筑:
generateStructures: false
# 超平坦家园(create 2)的地层设置。留空即使用内置预设:基岩1层 + 泥土2层 + 草方块1层,平原群系。
# 这里填的是原版 flat_level_generator_settings 的 JSON,必须包含 layers。
# 早期版本没有设置这一项,导致每次创建超平坦家园都会在控制台打印
# "No key layers in MapLike[{}]" 并回落到原版默认预设。
# 示例(全石头): '{"biome":"minecraft:plains","layers":[{"block":"minecraft:stone","height":64}]}'
Superflat:
  GeneratorSettings: ''
# 世界最大生成怪物数量:(-1为禁用)
MaxSpawnMonstersAmount: -1
# 世界最大生成动物数量:(-1为禁用)
MaxSpawnAnimalsAmount: -1
# 是否开启公共下界地狱的传送:/SH Nether,需自行开启服务端的地狱生成功能.
EnableNetherTeleport: false
# 指定一个您服务器的地狱世界名字:
NetherWorldName: DIM-1
# 开启哪些规则:
NeitherGameRules:
- keepInventory,true
- doMobSpawning,true
- mobGriefing,false
- doFireTick,false
# 是否开启公共末地的传送:/SH End,需自行开启服务端的末地生成功能.
EnableEndTeleport: false
# 指定一个您服务器的末地世界名字:
EndWorldName: DIM1
# 开启哪些规则:
EndGameRules:
- keepInventory,true
- doMobSpawning,true
- mobGriefing,false
- doFireTick,false
# 是否开启在线世界延迟统计前N名
EnableTilesAndChunksAndDropItemsStatisticsTop: true
# 显示的排名个数,5->代表前五
ShowAmount: 5
# 每多少秒提示一次
ShowTimes: 600
# 权重
OneTileTick: 0.005
OneEntityTick: 0.005
OneChunkTick: 0
OneDropTick: 1.0E-4
# 显示的小数位,默认2位小数
FormatInfo: '%.2f'
# 置顶
StatisticsTop:
- §7当前服务器玩家世界占用情况：
- §8§m————————————————————————————————————————————————————————
# 格式
ShowFormat: §6§l#<index> §a<world> §e的世界 §7<tile> §eTiles §7<chunk> §e区块 §7<entity>
  §e实体 §7<drop> §e掉落物 §e每Tick耗时 §7<tps> §eMs
# 置底
StatisticsEnd:
- §8§m————————————————————————————————————————————————————————
- §a上方世界仅供参考，如果存在你的家园请及时清理掉落物和生物！
# ========== SummerTown -> ErrorTown 重命名兼容 ==========
# 权限节点已从 SummerTown.* 改为 ErrorTown.*。
# 权限保存在 LuckPerms 等外部插件里，本插件无法自动迁移，因此默认同时接受旧节点。
# 在权限组全部改完之后请设为 false，避免旧节点继续生效。
LegacyPermissions: true
# 默认权限开关
Permission:
  CommandUser: true
  Visit: true
  SetSpawn: false
  Nether: false
  End: false
  Rain: false
  Sun: false
  Night: false
  Day: false
  Create-1: true
  Create-2: true
  Create-airland: true
  LockTime: false
  LockWeather: false


# 一天最大的投递鲜花的数量<额外权限:ErrorTown.Flowers.数字>:
MaxFlowers: 5
# 综合权重
PopularityAdd: 0.1
FlowerAdd: 0.3
# 默认上线地点世界（需自行设置世界出生点）'留空为不设置',该设置可以解决个别客户端进服提示维度崩客户端的BUG
NormalJoinWorld: ''

# 是否开启时间同步
EnableAsnycTime: false
# 根据哪个世界进行同步
AsyncTimeWorld: world
# 是否开启季节插件兼容同步:
RealisticSeasons: false

# 是否在GUI页面显示所有玩家,还是非公开的进行隐藏,ALL->显示公开,支持跨服/Public->显示公开,支持跨服/Load->显示加载,仅支持单服显示 三种选择.
VisitGuiShowAll: Load

# 是否开启玩家死亡后自动在家园复活
EnableAutoRespawnInHome: false

# 是否开启家园实体交互保护功能,盔甲架等物品无权限禁止交互,该功能对拔刀剑相关实体无效.
EnableEntityInteract: true

# 是否禁用家园传送门的创建
DisablePortalCreate: true

# 是否开启多世界兼容模式
MultiverseCoreCompability: true

# 是否开启版本检测
CheckUpdate: true

# 是否关闭世界出生点区块加载,纯净建议改成false关闭出生区块常加载,节约内存
# 模组服如果工业2玻璃纤维线缆短线的话建议为true,不然为反向优化!.
KeepSpawnInMemory: false


# 是否开启时间锁定功能,占用较大,若spark或者timings发现locktime占用较大改为false减轻压力.
EnableTimeLock: true
# 在玩家删除家园/家园卸载/被踢出家园时,自动传送至什么世界?
Spawn: world

# =========== 家园专属地狱(下界)功能 ===========
# 是否开启家园专属地狱:开启后,每个家园主世界会对应一个独立的地狱世界,
# 玩家在自己家园内搭建并进入"下界传送门"即可前往对应地狱;在地狱内进入下界传送门可返回家园主世界.
# 地狱会自动获得与家园主世界对应的边界(按 HomeNetherScale 换算),相当于一块"地狱版的家园地块".
# 主世界与地狱坐标按 1:HomeNetherScale 换算,实现坐标一一对应;两个世界各自独立刷怪,实现双维度刷怪.
# 注意:
# 1)需要服务端 server.properties 中 allow-nether=true;
# 2)开启本功能后,即使 DisablePortalCreate=true 也会允许在家园内搭建传送门;
# 3)若想主世界家园里也刷怪(真正的双维度刷怪),需把上面的 doMobSpawning 改为 true(地狱本身默认就刷怪).
EnableHomeNether: true
# 家园地狱世界名使用的后缀(地狱世界名 = 玩家名 + 后缀)
HomeNetherSuffix: _nether
# 主世界与地狱的坐标比例:
# 1  = 1:1 坐标完全相等,地狱大小与家园相同,最直观、最适合做双维度对照建筑/刷怪(推荐)
# 8  = 原版比例(主世界走8格=地狱走1格),适合家园地块非常大的情况(地块小则地狱会很小)
HomeNetherScale: 1

HomeNetherPortal:
  SearchRadius: 16
  CreationRadius: 16
  # true = 玩家/普通实体的找门与建门尽量交给原版内核处理, 坐标/落点会更接近原版
  # false = 使用插件自己的手动找门/补门逻辑(只建议在原版 POI/门搜索异常时临时兜底)
  UseVanillaResolver: true

Debug: false

EnableMultiverseCoreCreate: false

SkyIsland:
  Enable: true
  CreateKey: airland
  CenterX: 0
  CenterZ: 0
  SpawnY: 65
  ClearHeight: 6
  PlatformRadius: 3
  PlatformTop: GRASS_BLOCK
  PlatformMiddle: DIRT
  PlatformBottom: BEDROCK
  ChestOffsetX: 2
  ChestOffsetY: 1
  ChestOffsetZ: 0
  StarterChest:
