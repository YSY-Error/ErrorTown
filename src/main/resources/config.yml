    Items:
    - LAVA_BUCKET,1,0
    - ICE,2,1
    - OAK_SAPLING,1,2
    - DIRT,8,3

# ========== 群系修改配置 ==========
BiomeChange:
  Enable: true
  # 修改单个区块群系花费金币
  SingleChunkCost: 1000
  # 修改边界内所有群系花费金币
